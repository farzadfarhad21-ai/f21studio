name: Daily AI post

on:
  schedule:
    - cron: "0 4 * * *" # 08:00 Dubai
  workflow_dispatch:
    inputs:
      image_for:
        description: "Only regenerate the picture for this post slug"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write today's post
        run: node scripts/daily-post.mjs ${IMAGE_FOR:+--image-for=$IMAGE_FOR}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
          IMAGE_FOR: ${{ inputs.image_for }}

      - name: Check the site still builds
        run: npx next build

      - name: Publish
        env:
          IMAGE_FOR: ${{ inputs.image_for }}
        run: |
          git config user.name "F21 Studio Bot"
          git config user.email "bot@f21studio.com"
          git add -A content/blog public/blog
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          if [ -n "$IMAGE_FOR" ]; then msg="blog: new picture for $IMAGE_FOR"; else msg="blog: daily AI note $(date -u +%F)"; fi
          git commit -m "$msg"
          git push
