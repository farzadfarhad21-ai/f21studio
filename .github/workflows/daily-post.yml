name: Daily AI post

on:
  schedule:
    - cron: "0 4 * * *" # 08:00 Dubai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write today's post
        run: node scripts/daily-post.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}

      - name: Check the site still builds
        run: npx next build

      - name: Publish
        run: |
          git config user.name "F21 Studio Bot"
          git config user.email "bot@f21studio.com"
          git add content/blog public/blog
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "blog: daily AI note $(date -u +%F)"
          git push
